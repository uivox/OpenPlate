name: Check

# Type check, logic tests and a web build for pull requests and feature branches.
# Unlike build.yml this never publishes anything, so branches can be verified before they reach main.
on:
  pull_request:
  push:
    # offline-pack holds only the generated product data (offline-pack.yml), no code to check.
    branches-ignore: [main, offline-pack]
  workflow_dispatch:

# Pull requests (also from forks, e.g. community recipes) run with a read-only token.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/install-deps.sh
      - run: bash scripts/ci-run.sh npx tsc --noEmit
      - run: bash scripts/ci-run.sh npm test
      - name: Android project gets the release-signing config, the storage size and Health Connect (prebuild only, nothing is built or published)
        run: |
          bash scripts/ci-run.sh npx expo prebuild --platform android --no-install --clean
          grep -q "openplate-release-signing" android/app/build.gradle
          grep -q "signingConfig System.getenv('OPENPLATE_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug" android/app/build.gradle
          grep -q "^AsyncStorage_db_size_in_MB=1024$" android/gradle.properties
          # Steps: the read permission, the rationale screens Health Connect requires, and its minimum Android version.
          grep -q 'android:name="android.permission.health.READ_STEPS"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name="android.intent.action.VIEW_PERMISSION_USAGE"' android/app/src/main/AndroidManifest.xml
          grep -q "^android.minSdkVersion=26$" android/gradle.properties
          rm -rf android
      - name: Web build (catches bundling errors the type check misses)
        run: bash scripts/ci-run.sh npm run build:web
        env:
          WEB_BASE_URL: ''
      - name: Click through the web app in a headless browser
        run: |
          npm i --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          bash scripts/ci-run.sh node scripts/web-smoke.mjs dist
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-preview
          path: |
            dist
            smoke-shots
          retention-days: 7
